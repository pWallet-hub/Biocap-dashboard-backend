# API and Redis. MongoDB is the URL in MONGO_URI (from .env or the hosting platform). Secrets come from .env.
# The API starts even if Redis is down: it falls back to per-process cache and rate limits.
services:
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 1
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
