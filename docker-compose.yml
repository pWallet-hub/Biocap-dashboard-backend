# API only. MongoDB is the URL in MONGO_URI (from .env or the hosting platform). Secrets come from .env.
services:
  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 1
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
